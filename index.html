<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Digitaler Förderwegweiser für das Lesen in Jahrgang 5">
  <meta name="color-scheme" content="light">
  <title>Lese-Navigator Jahrgang 5</title>
  <style>
:root {
  --blue: #245688; --mint: #48DCCB; --orange: #F0A66F;
  --text: #18324a; --muted: #3d5061; --line: #c5d0d9;
  --panel: #f2f4f6; --white: #fff; --focus: #18324a;
  --font-heading: "Gagalin", "Segoe UI", Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--white); color: var(--text); }
body { font-family: "Glacial Indifference", "Segoe UI", Arial, sans-serif; font-size: 20px; line-height: 1.55; }
button, input { font: inherit; }
button { cursor: pointer; touch-action: manipulation; }
button:disabled { cursor: default; background: #edf0f3; border-color: #c5d0d9; color: #586776; }
button:focus-visible, input:focus-visible, summary:focus-visible, [tabindex="0"]:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; }
[tabindex="-1"]:focus { outline: none; }
[hidden] { display: none !important; }
h1, h2, h3, p { margin-top: 0; }
h1 { font-family: var(--font-heading); font-size: clamp(30px, 3.8vw, 44px); line-height: 1.2; margin-bottom: 20px; letter-spacing: -.02em; }
h2 { font-size: 25px; line-height: 1.3; }
h3 { font-size: 21px; }
p:last-child { margin-bottom: 0; }
.page-shell { max-width: 1240px; margin: auto; padding: 16px 24px; }
.navigator { display: grid; gap: 24px; }
.intro-layout { max-width: 880px; margin: 5vh auto 24px; }
.intro-card, .result-card { border: 1px solid var(--line); border-radius: 24px; padding: clamp(24px, 4vw, 44px); background: var(--white); }
.student-intro { border-top: 5px solid var(--blue); }
.student-intro > p { max-width: 52ch; }
.eyebrow { font-size: 16px; letter-spacing: .06em; color: var(--blue); font-weight: 700; margin-bottom: 12px; }
.form-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 20px; margin: 28px 0; }
label { display: grid; align-content: start; gap: 8px; font-weight: 700; }
input { width: 100%; min-width: 0; min-height: 56px; padding: 10px 14px; color: var(--text); border: 2px solid var(--line); border-radius: 12px; background: var(--white); }
small { font-size: 15px; font-weight: 400; color: var(--muted); }
.primary-button, .secondary-button, .danger-button { min-height: 60px; padding: 12px 24px; border: 2px solid var(--blue); border-radius: 14px; font-weight: 700; }
.primary-button { color: #fff; background: var(--blue); }
.primary-button span { margin-left: 12px; }
.secondary-button { color: var(--blue); background: var(--white); }
.danger-button { border-color: #893c1c; color: #893c1c; background: var(--white); }
.local-only-note { border-top: 1px solid var(--line); padding-top: 20px; margin-top: 28px; font-size: 17px; color: var(--muted); }
.note, .teacher-kicker { color: var(--muted); font-size: 16px; }
.error-message, .pilot-note { padding: 16px; border-left: 4px solid #a94a1a; background: #fff8f2; border-radius: 8px; }
.error-message { font-size: 18px; }
.pilot-note { font-size: 16px; }
/* A stable task frame: text scrolls inside the panel; confirmation never moves. */
.student-screen { height: calc(100vh - 32px); height: calc(100svh - 32px); grid-template-rows: 12px minmax(0, 1fr); gap: 16px; }
.progress-wrap { padding: 2px 0; }
.progress-track { height: 8px; border-radius: 8px; background: #e3eaf0; overflow: hidden; }
.progress-fill { height: 100%; background: var(--blue); border-radius: inherit; transition: width 160ms ease; }
.task-layout { display: grid; min-height: 0; gap: 20px; }
.task-layout.single-task { grid-template-columns: minmax(0, 860px); justify-content: center; }
.task-layout.has-passage { grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); }
.question-panel, .passage-panel { border: 1px solid var(--line); border-radius: 24px; min-height: 0; min-width: 0; padding: 22px 26px; }
.question-panel { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 18px; background: var(--white); }
.screen-label { display: inline-flex; align-items: center; justify-self: start; min-height: 32px; padding: 4px 12px; border: 1px solid #bdd4e7; border-radius: 8px; font-size: 15px; font-weight: 700; }
.task-label { background: #eff5fa; color: var(--blue); }
.example-label { background: #effcfa; border-color: #19766f; color: #195e59; }
.text-label { color: var(--muted); background: var(--white); border-color: var(--line); }
.example-card { border-top: 5px solid var(--mint); }
.question-body { min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 4px 5px 12px; scrollbar-gutter: stable; }
.question-body > * + * { margin-top: 20px; }
.prompt { font-family: inherit; font-size: clamp(22px, 2.5vw, 28px); font-weight: 700; line-height: 1.4; letter-spacing: normal; margin-bottom: 0; }
.stimulus { padding: 16px 20px; border-left: 4px solid var(--blue); border-radius: 8px; background: #eff5fa; font-size: 23px; line-height: 1.6; }
.target-word { background: none; border: none; padding: 4px 0; font-size: 38px; font-weight: 700; line-height: 1.25; }
.options { display: grid; gap: 12px; }
.option-button, .unknown-button { position: relative; width: 100%; text-align: left; color: var(--text); background: var(--white); border: 2px solid var(--line); border-radius: 14px; font-size: 20px; line-height: 1.45; min-height: 62px; padding: 14px 40px 14px 18px; }
.option-button.is-selected, .unknown-button.is-selected { border-color: var(--blue); background: #eff5fa; box-shadow: inset 0 0 0 1px var(--blue); }
.option-button.is-selected::after, .unknown-button.is-selected::after { content: "✓"; position: absolute; right: 12px; top: 12px; color: var(--blue); font-weight: 800; }
.unknown-button { border-style: dashed; color: var(--muted); font-size: 18px; min-height: 56px; }
.visual-options, .practice-options { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.visual-options .option-button { display: grid; place-items: center; padding: 20px 10px; min-height: 176px; }
.visual-asset { width: min(136px, 100%); height: 136px; object-fit: contain; }
.practice-option { text-align: center; font-size: 48px; min-height: 150px; padding: 16px; }
.action-row { display: flex; justify-content: flex-end; align-items: center; min-height: 76px; border-top: 1px solid #dfe5ea; padding-top: 14px; }
.action-row .primary-button { min-width: 174px; font-size: 21px; }
.passage-panel { display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 16px; background: var(--panel); }
.passage-content { min-height: 0; overflow: auto; overscroll-behavior: contain; padding: 2px 8px 8px 2px; font-size: 21px; line-height: 1.7; scrollbar-gutter: stable; }
.passage-content p { margin-bottom: 20px; }
.timed-text { max-width: 64ch; font-size: 23px; line-height: 1.75; margin: auto; }
.result-layout { max-width: 920px; margin: 24px auto; }
.result-card { display: grid; gap: 24px; }
.result-card h1, .result-card h2, .result-card p { margin-bottom: 0; }
.wave { --path-accent: var(--blue); }
.compass { --path-accent: var(--mint); }
.magnifier { --path-accent: var(--orange); }
.result-path { display: grid; grid-template-columns: 56px 1fr; gap: 20px; padding: 24px; border: 3px solid var(--path-accent); border-radius: 18px; }
.path-symbol svg { width: 54px; height: 54px; color: var(--text); }
.result-path h2 { margin-bottom: 8px; }
.strategy-hint { border-left: 4px solid #19766f; background: #effcfa; padding: 16px; border-radius: 8px; }
/* Teacher controls are only mounted on the introduction screen. */
.local-admin { border: 1px solid var(--line); border-radius: 16px; font-size: 18px; }
summary { cursor: pointer; padding: 18px 20px; min-height: 58px; font-weight: 700; }
.local-admin-body { padding: 0 24px 24px; }
.pin-row { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: end; }
.pin-row label { min-width: 0; }
.result-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
.result-actions button { font-size: 16px; }
.run-profile { border: 1px solid var(--line); border-radius: 12px; margin-top: 16px; }
.run-profile summary span { font-weight: 400; margin-left: 12px; }
.profile-body { padding: 0 24px 24px; }
table { width: 100%; border-collapse: collapse; margin: 20px 0; font-size: 17px; }
caption { text-align: left; font-weight: 700; padding-bottom: 12px; }
th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); }
td { white-space: nowrap; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
@media (hover: hover) {
  .option-button:hover, .unknown-button:hover { border-color: var(--blue); }
  .primary-button:not(:disabled):hover { background: #1f4770; }
}
@media (max-width: 759px), (orientation: portrait) {
  .page-shell { padding: 12px; }
  .student-screen { height: auto; min-height: calc(100svh - 24px); grid-template-rows: 12px auto; }
  .task-layout.has-passage { grid-template-columns: 1fr; }
  .passage-content { max-height: 38vh; }
  .question-panel, .passage-panel { padding: 18px; }
  .question-body { overflow: visible; padding-inline: 0; }
  .action-row { position: sticky; bottom: 0; background: var(--white); padding-bottom: 8px; z-index: 2; }
  .visual-options, .practice-options { gap: 8px; }
  .visual-options .option-button { min-height: 112px; padding: 12px 5px; }
  .visual-asset { width: 100%; height: 90px; }
  .practice-option { min-height: 110px; font-size: 36px; }
  .form-grid, .pin-row { grid-template-columns: 1fr; }
  .intro-layout { margin-top: 12px; }
  .target-word { font-size: 32px; }
  .result-path { grid-template-columns: 42px 1fr; padding: 18px; gap: 12px; }
  .path-symbol svg { width: 40px; height: 40px; }
}
@media (max-height: 500px) and (min-width: 760px) {
  .student-screen { height: auto; min-height: 100vh; }
  .question-body { overflow: visible; }
  .passage-content { max-height: 70vh; }
}
@media (prefers-reduced-motion: reduce) { .progress-fill { transition: none; } }
</style>
</head>
<body>
  <main id="app" class="page-shell">
    <div class="navigator">
      <section class="intro-card">
        <h1>Lese-Navigator</h1>
        <p>Die App wird geladen …</p>
      </section>
    </div>
  </main>
  <noscript>Für den Lese-Navigator muss JavaScript im Browser aktiviert sein.</noscript>
  <script>
"use strict";

const APP_VERSION = "0.7";
const PREFIX = "lesediagnostik5:v1";
const PARTICIPANTS_KEY = PREFIX + ":participants";
const RUNS_KEY = PREFIX + ":runs";
const TEACHER_PIN_KEY = PREFIX + ":teacher-pin";

const INITIAL_SCORES = {
  reading_base: 0,
  word_sentence: 0,
  text_basic: 0,
  text_deep: 0,
  word_analysis: 0,
  strategy: 0,
  fluency_check: 0
};

const state = {
  sets: [],
  rules: null,
  design: null,
  stage: "intro",
  runSeed: null,
  activeSet: null,
  queue: [],
  index: 0,
  scores: { ...INITIAL_SCORES },
  responses: {},
  fluency: { startedAt: null, seconds: null, wpm: null, interrupted: false },
  participantName: "",
  className: "",
  currentParticipant: null,
  resultData: null,
  teacherUnlocked: false,
  saveMessage: "",
  selectedOption: null,
  exampleSelected: false,
  optionOrders: {},
  runStartedAt: null,
  interrupted: false,
  pendingRun: null,
  assetError: false
};

const app = document.getElementById("app");
document.addEventListener("DOMContentLoaded", init);

async function init() {
  try {
    const values = await Promise.all([
      loadJson("./data/sets/eiche.json"),
      loadJson("./data/sets/ahorn.json"),
      loadJson("./data/sets/birke.json"),
      loadJson("./data/scoring/pilot-rules.json"),
      loadJson("./data/design.json")
    ]);
    state.sets = values.slice(0, 3);
    state.rules = values[3];
    state.design = values[4];
    validateProject(state.sets, state.rules);
    await preloadAssets(state.sets);
    applyDesignConfig();
    render();
  } catch (error) {
    console.error(error);
    app.innerHTML =
      '<div class="navigator"><section class="intro-card">' +
      '<h1>Lese-Navigator</h1>' +
      '<p class="error-message">Die Aufgaben oder Bilder konnten nicht geladen werden.</p>' +
      '<p class="note">Bitte die Seite neu laden. Wenn der Fehler bleibt, bitte die Lehrkraft holen.</p>' +
      '</section></div>';
  }
}

async function loadJson(url) {
  const response = await fetch(url, { cache: "no-store" });
  if (!response.ok) throw new Error("Fehler beim Laden von " + url);
  return response.json();
}

function storageAvailable() {
  try {
    const key = PREFIX + ":probe";
    localStorage.setItem(key, "1");
    localStorage.removeItem(key);
    return true;
  } catch {
    return false;
  }
}

function safeParse(value, fallback) {
  try {
    return value ? JSON.parse(value) : fallback;
  } catch {
    return fallback;
  }
}

function loadParticipants() {
  return readStoredArray(PARTICIPANTS_KEY, function (p) {
    return p && typeof p.id === "string" && typeof p.name === "string" && typeof p.className === "string";
  });
}

function loadRuns() {
  return readStoredArray(RUNS_KEY, function (r) {
    return r && typeof r.id === "string" && typeof r.participantId === "string" &&
      typeof r.completedAt === "string" && typeof r.setId === "string" &&
      r.scores && typeof r.scores === "object" && r.responses && typeof r.responses === "object" &&
      !Array.isArray(r.responses) && Object.values(r.responses).every(v => typeof v === "string") &&
      Object.keys(INITIAL_SCORES).every(k => Number.isInteger(r.scores[k]) && r.scores[k] >= 0) &&
      Array.isArray(r.itemResults) && r.itemResults.every(i => i && typeof i.itemId === "string" &&
        typeof i.response === "string" && [true, false, null].includes(i.correct)) &&
      (!r.readingBase || Object.values(r.readingBase).every(v => v && Number.isInteger(v.correct) && Number.isInteger(v.total))) &&
      (!r.optionOrders || Object.values(r.optionOrders).every(v => Array.isArray(v) && v.every(x => typeof x === "string")));
  });
}

function readStoredArray(key, validate) {
  let raw;
  try { raw = localStorage.getItem(key); }
  catch { throw new Error("Der lokale Speicher ist nicht verfügbar. Bitte die Lehrkraft holen."); }
  if (raw == null) return [];
  let value;
  try { value = JSON.parse(raw); } catch { /* Keep the original bytes untouched. */ }
  if (!Array.isArray(value) || !value.every(validate)) {
    throw new Error("Gespeicherte Daten sind beschädigt. Sie wurden nicht überschrieben. Bitte zuerst eine Rohsicherung herunterladen.");
  }
  return value;
}

function makeId(prefix) {
  if (typeof crypto !== "undefined" && crypto.randomUUID) {
    return prefix + "-" + crypto.randomUUID();
  }
  return prefix + "-" + Date.now() + "-" + Math.random().toString(36).slice(2);
}

function upsertParticipant(name, className) {
  const cleanName = String(name || "").trim();
  const cleanClass = String(className || "").trim();
  if (!cleanName) throw new Error("Bitte einen Namen oder ein Kürzel eingeben.");

  const participants = loadParticipants();
  const existing = participants.find(function (item) {
    return item.name.toLocaleLowerCase("de-DE") === cleanName.toLocaleLowerCase("de-DE") &&
      item.className.toLocaleLowerCase("de-DE") === cleanClass.toLocaleLowerCase("de-DE");
  });
  if (existing) return existing;

  const participant = {
    id: makeId("p"),
    name: cleanName,
    className: cleanClass,
    createdAt: new Date().toISOString()
  };
  localStorage.setItem(PARTICIPANTS_KEY, JSON.stringify(participants.concat([participant])));
  return participant;
}

function saveDiagnosticRun(run) {
  const runs = loadRuns();
  const entry = Object.assign({}, run, {
    id: run.id || makeId("r"),
    completedAt: run.completedAt || new Date().toISOString(),
    schemaVersion: 2
  });
  if (!runs.some(r => r.id === entry.id)) localStorage.setItem(RUNS_KEY, JSON.stringify(runs.concat([entry])));
  return entry;
}

function deleteAllLocalData() {
  localStorage.removeItem(PARTICIPANTS_KEY);
  localStorage.removeItem(RUNS_KEY);
}

function bytesToBase64(bytes) {
  let binary = "";
  for (const byte of bytes) binary += String.fromCharCode(byte);
  return btoa(binary);
}

function base64ToBytes(value) {
  const binary = atob(value);
  return Uint8Array.from(binary, function (char) { return char.charCodeAt(0); });
}

async function derivePinHash(pin, salt) {
  const material = await crypto.subtle.importKey(
    "raw",
    new TextEncoder().encode(pin),
    "PBKDF2",
    false,
    ["deriveBits"]
  );
  const bits = await crypto.subtle.deriveBits(
    { name: "PBKDF2", salt: salt, iterations: 180000, hash: "SHA-256" },
    material,
    256
  );
  return new Uint8Array(bits);
}

function hasTeacherPin() {
  return storageAvailable() && Boolean(localStorage.getItem(TEACHER_PIN_KEY));
}

async function setTeacherPin(pin) {
  const clean = String(pin || "").trim();
  if (!/^\d{4,10}$/.test(clean)) {
    throw new Error("Die Lehrkraft-PIN muss aus 4 bis 10 Ziffern bestehen.");
  }
  if (typeof crypto === "undefined" || !crypto.subtle) {
    throw new Error("Dieser Browser unterstützt die lokale PIN-Sicherung nicht.");
  }
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const hash = await derivePinHash(clean, salt);
  localStorage.setItem(TEACHER_PIN_KEY, JSON.stringify({
    version: 1,
    salt: bytesToBase64(salt),
    hash: bytesToBase64(hash)
  }));
}

async function verifyTeacherPin(pin) {
  if (typeof crypto === "undefined" || !crypto.subtle) return false;
  const stored = safeParse(localStorage.getItem(TEACHER_PIN_KEY), null);
  if (!stored || !stored.salt || !stored.hash) return false;
  const salt = base64ToBytes(stored.salt);
  const expected = base64ToBytes(stored.hash);
  const actual = await derivePinHash(String(pin || "").trim(), salt);
  if (actual.length !== expected.length) return false;
  let difference = 0;
  for (let i = 0; i < actual.length; i += 1) difference |= actual[i] ^ expected[i];
  return difference === 0;
}

function flattenSet(set) {
  return set.sections.flatMap(function (section) {
    return section.items.map(function (item) {
      return Object.assign({}, item, {
        sectionId: section.id,
        sectionTitle: section.title,
        contextPassage: section.passage || null
      });
    });
  });
}

function seededRandom(seed) {
  let value = seed >>> 0;
  return function () {
    value += 0x6D2B79F5;
    let t = Math.imul(value ^ value >>> 15, 1 | value);
    t ^= t + Math.imul(t ^ t >>> 7, 61 | t);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function shuffled(values, random) {
  const copy = values.slice();
  for (let i = copy.length - 1; i > 0; i -= 1) {
    const j = Math.floor(random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function prepareOptionOrders(queue, seed) {
  const random = seededRandom(seed);
  const groups = new Map();
  const orders = {};
  queue.forEach(function (item) {
    if (!item.options) return;
    if (!item.correctOption) { orders[item.id] = item.options.map(o => o.id); return; }
    const size = item.options.length;
    if (!groups.has(size)) groups.set(size, []);
    groups.get(size).push(item);
  });
  groups.forEach(function (items, size) {
    const offset = Math.floor(random() * size);
    const positions = shuffled(items.map((_, i) => (i + offset) % size), random);
    items.forEach(function (item, i) {
      const wrong = shuffled(item.options.filter(o => o.id !== item.correctOption), random).map(o => o.id);
      wrong.splice(positions[i], 0, item.correctOption);
      orders[item.id] = wrong;
    });
  });
  return orders;
}

function orderedOptions(options, seed, itemId) {
  const order = state.optionOrders[itemId];
  if (!order) return options.slice();
  return order.map(id => options.find(o => o.id === id));
}

function pickRunSeed() {
  if (typeof crypto !== "undefined" && crypto.getRandomValues) {
    const data = new Uint32Array(1);
    crypto.getRandomValues(data);
    return data[0] || 1;
  }
  return Date.now() % 2147483647;
}

function applyDesignConfig() {
  if (!state.design) return;

  const root = document.documentElement;
  const theme = state.design.theme || {};
  const paths = state.design.paths || {};

  if (theme.background) root.style.setProperty("--white", theme.background);
  if (theme.text) root.style.setProperty("--text", theme.text);
  if (theme.lightGray) root.style.setProperty("--panel", theme.lightGray);

  if (paths.wave && paths.wave.color) {
    root.style.setProperty("--blue", paths.wave.color);
  }
  if (paths.compass && paths.compass.color) {
    root.style.setProperty("--mint", paths.compass.color);
  }
  if (paths.magnifier && paths.magnifier.color) {
    root.style.setProperty("--orange", paths.magnifier.color);
  }

  if (theme.fontHeading) root.style.setProperty("--font-heading", '"' + theme.fontHeading + '", "Segoe UI", Arial, sans-serif');
  if (theme.fontBody) {
    document.body.style.fontFamily =
      '"' + theme.fontBody + '", "Aptos", "Segoe UI", Arial, sans-serif';
  }
}

function compareValue(actual, rule) {
  if (actual == null || !rule || typeof rule !== "object" || !Object.keys(rule).length ||
      Object.keys(rule).some(k => !["lt", "lte", "gt", "gte", "eq"].includes(k))) return false;
  if (rule.lt != null && !(actual < rule.lt)) return false;
  if (rule.lte != null && !(actual <= rule.lte)) return false;
  if (rule.gt != null && !(actual > rule.gt)) return false;
  if (rule.gte != null && !(actual >= rule.gte)) return false;
  if (rule.eq != null && !(actual === rule.eq)) return false;
  return true;
}

function matchesCondition(condition, scores, context) {
  if (!condition || typeof condition !== "object" || !Object.keys(condition).length) return false;
  context = context || {};

  if (condition.primary != null && context.primary !== condition.primary) {
    return false;
  }

  if (Array.isArray(condition.any)) {
    const anyMatches = condition.any.some(function (part) {
      return matchesCondition(part, scores, context);
    });
    if (!anyMatches) return false;
  }

  return Object.keys(condition).every(function (key) {
    if (key === "any" || key === "primary") return true;
    return compareValue(scores[key], condition[key]);
  });
}

function firstMatchingRecommendation(rules, scores, context) {
  const match = (rules || []).find(function (entry) {
    return matchesCondition(entry.when, scores, context);
  });
  return match ? match.recommend : null;
}

function recommendationFrom(scores) {
  const valid = Object.entries(state.rules.scoreKeys).every(function ([key, rule]) {
    return Number.isInteger(scores[key]) && scores[key] >= 0 && scores[key] <= rule.max;
  });
  const matches = valid ? state.rules.primaryLogic.filter(r => matchesCondition(r.when, scores, {})) : [];
  if (matches.length !== 1) return { primary: null, secondary: null, strategyHint: false, needsReview: true };
  const primary = matches[0].recommend;
  return {
    primary: primary,
    secondary: firstMatchingRecommendation(state.rules.secondaryLogic, scores, { primary: primary }),
    strategyHint: matchesCondition(state.rules.strategyHint.when, scores, { primary: primary }),
    needsReview: false
  };
}

function applyScore(scores, item, optionId) {
  if (!item || !item.scoreKey || !item.correctOption || optionId !== item.correctOption) return scores;
  const next = Object.assign({}, scores);
  next[item.scoreKey] = (next[item.scoreKey] || 0) + 1;
  return next;
}

function buildItemResults(queue, responses) {
  return queue.filter(function (item) {
    return Object.prototype.hasOwnProperty.call(responses, item.id);
  }).map(function (item) {
    const response = responses[item.id];
    return {
      itemId: item.id,
      response: response,
      competency: item.competency || "",
      scoreKey: item.scoreKey || "",
      correct: item.correctOption == null ? null : response !== "unknown" && response === item.correctOption
    };
  });
}

function teacherProfiles() {
  const runs = loadRuns().slice(-50).reverse();
  if (!runs.length) return '<p class="note">Noch keine Ergebnisse auf diesem Browser.</p>';
  return '<h2>Die letzten ' + runs.length + ' Durchläufe</h2>' + runs.map(function (run) {
    const legacy = run.setVersion !== "0.4";
    const recommendation = run.recommendation || {};
    const label = state.rules.recommendations[recommendation.primary]?.label || "Bitte prüfen";
    const base = run.readingBase || readingBaseProfile(run.itemResults);
    const rows = Object.entries(state.rules.scoreKeys).map(function ([key, rule]) {
      return '<tr><th scope="row">' + escapeHtml(rule.label) + '</th><td>' + escapeHtml(run.scores[key]) + ' / ' + rule.max + '</td></tr>';
    }).join('');
    const components = Object.entries(state.rules.readingBaseComponents).map(function ([key, rule]) {
      const value = base[key];
      return '<li>' + escapeHtml(rule.label) + ': ' + (value && value.total ? value.correct + ' / ' + value.total : 'nicht erhoben') + '</li>';
    }).join('');
    const interpretation = run.fluency?.interpretation || fluencyInterpretation(run.scores, run.fluency);
    const tempo = run.fluency && Number.isFinite(run.fluency.wpm) ? run.fluency.wpm + ' Wörter/Minute' : 'nicht verfügbar';
    const explanation = state.rules.fluency.checkLabels[interpretation] || 'Unterbrochen oder nicht vollständig gemessen; nicht als Tempo-Hinweis verwenden.';
    const self = run.itemResults.filter(i => i.competency === 'self_assessment').map(function (i) {
      const item = state.sets.find(s => s.setId === run.setId)?.sections.flatMap(s => s.items).find(x => x.id === i.itemId);
      // Only resolve unchanged anchor items from known historical set versions.
      const text = ['0.2', '0.3', '0.4'].includes(run.setVersion) ? item?.options.find(o => o.id === i.response)?.text : null;
      return '<li>' + escapeHtml(text ? item.prompt + ' ' + text : i.itemId + ': ' + i.response) + '</li>';
    }).join('');
    const unknowns = Object.values(run.responses).filter(v => v === 'unknown').length;
    const warnings = [];
    if (legacy) warnings.push('Ältere Aufgabenfassung: Das heutige Teilprofil und die aktuelle Begründung sind nicht rückwirkend anwendbar. Die gespeicherte Empfehlung bleibt unverändert.');
    if (unknowns) warnings.push(unknowns + ' Antworten „Ich weiß es nicht“: Unsicherheit und Aufgabenverständnis besprechen.');
    if (run.interrupted) warnings.push('Der Browser war während des Durchlaufs im Hintergrund. Die Bearbeitungszeit enthält Unterbrechungen.');
    if (!legacy && Object.values(base).some(v => v.total && v.correct <= 1)) warnings.push('Mindestens ein Teil der Lesebasis wurde höchstens einmal richtig gelöst. Vor einer Förderentscheidung gezielt nachprüfen.');
    return '<details class="run-profile"><summary>' + escapeHtml(run.participantNameSnapshot || run.participantId) + ' · ' + escapeHtml(run.classNameSnapshot || 'ohne Klasse') + ' <span>' + escapeHtml(label) + '</span></summary><div class="profile-body">' +
      '<p class="note">' + escapeHtml(new Date(run.completedAt).toLocaleString('de-DE')) + ' · ' + escapeHtml(run.setId) + ' ' + escapeHtml(run.setVersion) + ' · Regeln ' + escapeHtml(run.rulesVersion || 'unbekannt') + '</p>' +
      '<p><strong>Gespeicherte Empfehlung: ' + escapeHtml(label) + '</strong>' + (recommendation.secondary ? ' · Ergänzend: ' + escapeHtml(state.rules.recommendations[recommendation.secondary]?.label || recommendation.secondary) : '') + '</p>' +
      (!legacy ? '<p>' + escapeHtml(recommendationReason(run.scores, recommendation)) + '</p>' : '') +
      warnings.map(w => '<p class="pilot-note">' + escapeHtml(w) + '</p>').join('') +
      '<table><caption>Teilprofil · vorläufige Pilotwerte</caption><tbody>' + rows + '</tbody></table>' +
      '<h3>Lesebasis im Detail</h3><ul>' + components + '</ul>' +
      '<h3>Stilles Lesetempo</h3><p>' + escapeHtml(tempo) + ' · Lesezeit ' + escapeHtml(run.fluency?.seconds != null ? Math.round(run.fluency.seconds * 10) / 10 + ' s' : 'nicht verfügbar') + '</p><p>' + escapeHtml(explanation) + '</p>' +
      '<p class="note">Zeit ist selbst gemeldet; auch zwei richtige Kontrollfragen bestätigen keinen gültigen Tempowert. Auffällige Zeiten anhand der Beobachtung prüfen. Kein WPM-Grenzwert, keine automatische Tempo-Zuweisung.</p>' +
      '<h3>Selbsteinschätzung – Gesprächsanlass</h3><ul>' + self + '</ul><p class="note">Passt das zu den Aufgaben und zum Lautlesen? Häufiges Nachlesen kann eine sinnvolle Strategie sein.</p>' +
      '<p class="note">Gesamtdauer: ' + escapeHtml(run.durationSeconds != null ? run.durationSeconds + ' s' : 'nicht erhoben') + '</p>' +
      '</div></details>';
  }).join('');
}

function recommendationReason(scores, recommendation) {
  if (!recommendation.primary) return "Keine verlässliche automatische Empfehlung. Daten und Durchführung prüfen.";
  const match = state.rules.primaryLogic.find(r => r.recommend === recommendation.primary && matchesCondition(r.when, scores));
  if (!match) return "Die gespeicherte Empfehlung stammt aus einer anderen Regelfassung.";
  return match.teacherText || "Vorläufige Empfehlung anhand der dokumentierten Pilotregeln.";
}

async function handleTeacherPin() {
  const input = document.getElementById("teacher-pin");
  const errorBox = document.getElementById("pin-error");
  const pin = String(input ? input.value : "").trim();
  const action = document.getElementById("pin-action");
  if (!action || action.disabled) return;
  action.disabled = true;

  try {
    if (!hasTeacherPin()) {
      await setTeacherPin(pin);
      state.teacherUnlocked = !document.hidden;
      renderIntro();
      return;
    }
    if (!/^\d{4,10}$/.test(pin)) throw new Error("Bitte 4 bis 10 Ziffern eingeben.");
    const valid = await verifyTeacherPin(pin);
    if (!valid) throw new Error("Die PIN ist nicht richtig.");
    state.teacherUnlocked = !document.hidden;
    renderIntro();
  } catch (error) {
    if (action) action.disabled = false;
    if (errorBox) {
      errorBox.hidden = false;
      errorBox.textContent = error instanceof Error ? error.message : "Die PIN konnte nicht verarbeitet werden.";
    }
  }
}

function startRun() {
  state.participantName = document.getElementById("participant-name").value || "";
  state.className = document.getElementById("class-name").value || "";

  if (!storageAvailable()) {
    renderIntro("Der lokale Browserspeicher ist auf diesem Gerät nicht verfügbar.");
    return;
  }
  if (!hasTeacherPin()) {
    renderIntro("Vor dem ersten Durchlauf muss die Lehrkraft unten eine Geräte-PIN festlegen.");
    return;
  }

  try {
    loadRuns();
    state.currentParticipant = upsertParticipant(state.participantName, state.className);
  } catch (error) {
    renderIntro(error instanceof Error ? error.message : "Die lokalen Angaben konnten nicht gespeichert werden.");
    return;
  }

  let previous;
  try { previous = loadRuns().filter(r => r.participantId === state.currentParticipant.id).slice(-2).map(r => r.setId); }
  catch (error) { renderIntro(error.message); return; }
  state.runSeed = pickRunSeed();
  const available = state.sets.filter(set => !previous.includes(set.setId));
  state.activeSet = (available.length ? available : state.sets)[state.runSeed % (available.length || state.sets.length)];
  state.teacherUnlocked = false;
  state.runStartedAt = Date.now();
  state.interrupted = false;
  state.pendingRun = null;
  state.assetError = false;
  state.queue = flattenSet(state.activeSet);
  state.optionOrders = prepareOptionOrders(state.queue, state.runSeed);
  state.index = 0;
  state.scores = Object.assign({}, INITIAL_SCORES);
  state.responses = {};
  state.fluency = { startedAt: null, seconds: null, wpm: null, interrupted: false };
  state.resultData = null;
  state.saveMessage = "";
  state.selectedOption = null;
  state.exampleSelected = false;
  state.stage = "example";
  render();
}

function renderTask() {
  const current = state.queue[state.index];
  if (!current) return;
  const oldPassage = document.getElementById("reading-passage");
  const oldText = oldPassage ? oldPassage.dataset.passage : null;
  const oldScroll = oldPassage ? oldPassage.scrollTop : 0;
  const progress = Math.round((state.index / state.queue.length) * 100);
  const isTimed = current.type === "timed_reading";
  let content;
  if (isTimed) {
    const started = state.fluency.startedAt != null;
    content = '<section class="question-panel reading-panel"><span class="screen-label task-label">Leseaufgabe</span>' +
      '<div class="question-body">' + (started
        ? '<h1 id="task-heading" class="sr-only" tabindex="-1">Lies den Text.</h1><div class="timed-text" tabindex="0" role="region" aria-label="Lesetext">' + escapeHtml(current.text) + '</div>'
        : '<h1 id="task-heading" tabindex="-1">Lies einen kurzen Text.</h1><p class="prompt">Lies leise in deinem normalen Tempo.</p><p>Tippe am Ende auf „Fertig gelesen“.</p>') +
      '</div><div class="action-row"><button id="' + (started ? 'finish-reading' : 'start-reading') + '" class="primary-button" type="button">' + (started ? 'Fertig gelesen' : 'Text zeigen') + '</button></div></section>';
  } else {
    const options = orderedOptions(current.options || [], state.runSeed, current.id);
    content = '<section class="question-panel"><span class="screen-label task-label">' + (current.type === 'self_report' ? 'Über dein Lesen' : 'Aufgabe') + '</span>' +
      '<div class="question-body">' +
      (current.stimulus ? '<div class="stimulus' + (['visual_choice'].includes(current.type) || current.competency === 'orthographic_discrimination' ? ' target-word' : '') + '">' + escapeHtml(current.stimulus) + '</div>' : '') +
      '<h1 id="task-heading" class="prompt" tabindex="-1">' + escapeHtml(current.prompt) + '</h1>' +
      '<div class="options ' + (current.type === 'visual_choice' ? 'visual-options' : '') + '" role="group" aria-labelledby="task-heading">' +
      options.map(function (option, index) {
        const visual = current.type === 'visual_choice';
        return '<button class="option-button" type="button" data-option="' + escapeAttribute(option.id) + '" aria-pressed="false"' + (visual ? ' aria-label="Bildoption ' + (index + 1) + '"' : '') + '>' +
          (visual ? '<img class="visual-asset" src="' + escapeAttribute(assetUrl(option.asset)) + '" alt="" width="128" height="128" decoding="async">' : '<span>' + escapeHtml(option.text) + '</span>') + '</button>';
      }).join('') + '</div>' +
      (current.type !== 'self_report' ? '<button id="unknown-answer" class="unknown-button" type="button" aria-pressed="false">Ich weiß es nicht.</button>' : '<p class="note">Hier gibt es kein Richtig oder Falsch.</p>') +
      '<p id="asset-error" class="error-message" role="alert" hidden>Ein Bild fehlt. Bitte die Lehrkraft holen und diese Seite offen lassen.</p>' +
      '</div><div class="action-row"><button id="confirm-answer" class="primary-button" type="button" disabled>Weiter <span aria-hidden="true">→</span></button></div></section>';
  }
  app.innerHTML = '<div class="navigator student-screen">' + progressMarkup(progress) +
    '<div class="task-layout ' + (current.contextPassage ? 'has-passage' : 'single-task') + '">' +
    (current.contextPassage ? '<section class="passage-panel" aria-label="Text"><span class="screen-label text-label">Text</span><div id="reading-passage" class="passage-content" data-passage="' + escapeAttribute(current.sectionId) + '" tabindex="0" role="region" aria-label="Lesetext zum Nachschlagen">' +
      current.contextPassage.split(/\n\n/).map(p => '<p>' + escapeHtml(p) + '</p>').join('') + '</div></section>' : '') + content + '</div></div>';
  document.querySelectorAll('[data-option]').forEach(button => button.addEventListener('click', () => answer(button.dataset.option)));
  const unknown = document.getElementById('unknown-answer');
  if (unknown) unknown.addEventListener('click', answerUnknown);
  const confirm = document.getElementById('confirm-answer');
  if (confirm) confirm.addEventListener('click', confirmAnswer);
  const start = document.getElementById('start-reading');
  if (start) start.addEventListener('click', function () { state.fluency.startedAt = performance.now(); renderTask(); });
  const finish = document.getElementById('finish-reading');
  if (finish) finish.addEventListener('click', finishTimedReading);
  document.querySelectorAll('.visual-asset').forEach(function (image) {
    image.addEventListener('error', function () {
      state.assetError = true;
      document.getElementById('asset-error').hidden = false;
      if (confirm) confirm.disabled = true;
    });
  });
  const passage = document.getElementById('reading-passage');
  if (passage && oldText === current.sectionId) passage.scrollTop = oldScroll;
  focusTask();
}

function updateSelection() {
  document.querySelectorAll('[data-option], #unknown-answer').forEach(function (button) {
    const id = button.id === 'unknown-answer' ? 'unknown' : button.dataset.option;
    const selected = state.selectedOption === id;
    button.classList.toggle('is-selected', selected);
    button.setAttribute('aria-pressed', String(selected));
  });
  const confirm = document.getElementById('confirm-answer');
  if (confirm) confirm.disabled = !state.selectedOption || state.assetError;
}

function answer(optionId) {
  const current = state.queue[state.index];
  if (!current || !current.options.some(o => o.id === optionId)) return;
  state.selectedOption = optionId;
  updateSelection();
}

function answerUnknown() {
  if (state.queue[state.index]?.type === 'self_report') return;
  state.selectedOption = "unknown";
  updateSelection();
}

function confirmAnswer() {
  const current = state.queue[state.index];
  const optionId = state.selectedOption;
  if (!current || !optionId || state.assetError) return;

  const nextResponses = Object.assign({}, state.responses);
  nextResponses[current.id] = optionId;

  const nextScores = optionId === "unknown"
    ? state.scores
    : applyScore(state.scores, current, optionId);

  advance(nextScores, nextResponses);
}

function advance(nextScores, nextResponses) {
  state.scores = nextScores;
  state.responses = nextResponses;
  state.selectedOption = null;
  state.assetError = false;
  state.index += 1;
  if (state.index >= state.queue.length) {
    completeRun();
    return;
  }
  renderTask();
}

function finishTimedReading() {
  const current = state.queue[state.index];
  if (!current || current.type !== "timed_reading" || state.fluency.startedAt == null) return;
  const seconds = (performance.now() - state.fluency.startedAt) / 1000;
  state.fluency.seconds = seconds > 0 ? seconds : null;
  state.fluency.wpm = seconds > 0 ? Math.round((current.wordCount / seconds) * 60) : null;
  state.fluency.startedAt = null;
  state.selectedOption = null;
  state.assetError = false;
  state.index += 1;
  if (state.index >= state.queue.length) { completeRun(); return; }
  renderTask();
}

function completeRun() {
  const recommendation = recommendationFrom(state.scores);
  const itemResults = buildItemResults(state.queue, state.responses);
  state.resultData = { scores: state.scores, responses: state.responses, recommendation: recommendation, itemResults: itemResults };
  state.pendingRun = {
    id: makeId("r"), completedAt: new Date().toISOString(),
    participantId: state.currentParticipant.id,
    participantNameSnapshot: state.currentParticipant.name,
    classNameSnapshot: state.currentParticipant.className,
    setId: state.activeSet.setId, setVersion: state.activeSet.version,
    rulesVersion: state.rules.version, appVersion: APP_VERSION,
    scores: state.scores, responses: state.responses, itemResults: itemResults,
    readingBase: readingBaseProfile(itemResults),
    optionOrders: state.optionOrders,
    durationSeconds: Math.round((Date.now() - state.runStartedAt) / 1000),
    interrupted: state.interrupted,
    fluency: Object.assign({}, state.fluency, { interpretation: fluencyInterpretation(state.scores, state.fluency) }),
    recommendation: recommendation
  };
  delete state.pendingRun.fluency.startedAt;
  persistPendingRun();
  state.stage = "result";
  render();
}

function persistPendingRun() {
  try {
    saveDiagnosticRun(state.pendingRun);
    state.pendingRun = null;
    state.saveMessage = "";
  } catch (error) {
    state.saveMessage = "Bitte die Lehrkraft holen. Dein Ergebnis konnte noch nicht gespeichert werden. Lass diese Seite offen.";
  }
}

function readingBaseProfile(items) {
  const result = {};
  Object.keys(state.rules.readingBaseComponents).forEach(function (key) {
    const matches = items.filter(i => i.competency === key && i.scoreKey === "reading_base");
    result[key] = { correct: matches.filter(i => i.correct === true).length, total: matches.length };
  });
  return result;
}

function fluencyInterpretation(scores, fluency) {
  if (!fluency || !Number.isFinite(fluency.seconds) || fluency.seconds <= 0 || fluency.interrupted) return "interrupted_or_missing";
  return state.rules.fluency.checkInterpretation[String(scores.fluency_check)] || "do_not_use";
}

function renderResult() {
  const recommendation = state.resultData.recommendation;
  const primary = state.rules.recommendations[recommendation.primary];
  const secondary = state.rules.recommendations[recommendation.secondary];
  function card(path, title) {
    return '<div class="result-path ' + pathClass(path.id) + '"><div class="path-symbol">' + pathIcon(path.id) + '</div><div><h2>' + escapeHtml(title + path.label) + '</h2><p>' + escapeHtml(path.childText) + '</p></div></div>';
  }
  app.innerHTML = '<div class="navigator result-layout">' + progressMarkup(100) +
    '<section class="result-card"><div class="eyebrow">Geschafft</div><h1 id="task-heading" tabindex="-1">Dein nächster Leseschritt</h1>' +
    (primary ? card(primary, 'Starte mit ') : '<p>Schau gemeinsam mit deiner Lehrkraft, was du als Nächstes üben kannst.</p>') +
    (secondary ? card(secondary, 'Auch passend: ') : '') +
    (recommendation.strategyHint ? '<p class="strategy-hint">' + escapeHtml(state.rules.strategyHint.childText) + '</p>' : '') +
    '<p>Das ist ein Startpunkt. Du kannst deinen Lernweg später ändern.</p>' +
    (state.pendingRun ? '<p class="error-message" role="alert">' + escapeHtml(state.saveMessage) + '</p><button id="retry-save" class="secondary-button" type="button">Speichern erneut versuchen</button>' : '<div class="action-row"><button id="done" class="primary-button" type="button">Fertig</button></div>') +
    '</section></div>';
  const done = document.getElementById('done');
  if (done) done.addEventListener('click', () => resetToIntro(false));
  const retry = document.getElementById('retry-save');
  if (retry) retry.addEventListener('click', function () { persistPendingRun(); renderResult(); });
  focusTask();
}

function resetToIntro(keepParticipant) {
  state.teacherUnlocked = false;
  state.pendingRun = null;
  state.optionOrders = {};
  state.stage = "intro";
  state.runSeed = null;
  state.activeSet = null;
  state.queue = [];
  state.index = 0;
  state.scores = Object.assign({}, INITIAL_SCORES);
  state.responses = {};
  state.fluency = { startedAt: null, seconds: null, wpm: null, interrupted: false };
  state.resultData = null;
  state.saveMessage = "";
  state.selectedOption = null;
  state.exampleSelected = false;
  if (!keepParticipant) {
    state.participantName = "";
    state.className = "";
    state.currentParticipant = null;
  }
  render();
}

function pathClass(id) {
  if (id === "wave") return "wave";
  if (id === "compass") return "compass";
  return "magnifier";
}

function handleDeleteAll() {
  if (!state.teacherUnlocked) return;
  if (!confirm("Alle lokal gespeicherten Namen/Kürzel und Diagnoseergebnisse auf diesem Browser wirklich löschen?")) {
    return;
  }
  deleteAllLocalData();
  state.participantName = "";
  state.className = "";
  state.currentParticipant = null;
  renderIntro();
}

function csvEscape(value) {
  let text = value == null ? "" : String(value);
  if (/^[\s]*[=+@-]/.test(text) || /^[\t\r\n]/.test(text)) text = "'" + text;
  return /[;"\n\r]/.test(text) ? '"' + text.replaceAll('"', '""') + '"' : text;
}

function downloadCsv(filename, rows) {
  const body = rows.map(row => row.map(csvEscape).join(';')).join('\r\n');
  downloadFile(filename, "\uFEFF" + body, "text/csv;charset=utf-8");
}

function downloadFile(filename, body, type) {
  const url = URL.createObjectURL(new Blob([body], { type: type }));
  const anchor = document.createElement('a');
  anchor.href = url; anchor.download = filename;
  document.body.appendChild(anchor); anchor.click(); anchor.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function exportSummaryCsv() {
  if (!state.teacherUnlocked) return;
  const participants = loadParticipants();
  const participantMap = new Map(participants.map(function (item) {
    return [item.id, item];
  }));
  const runs = loadRuns();
  const rows = [[
    "teilnehmer_id","name_oder_kuerzel","klasse","zeitpunkt","parallelform",
    "aufgabensatz_version","auswertungsregeln_version","app_version",
    "lesebasis","wort_satz","textverstaendnis","tiefes_textverstaendnis",
    "worterschliessung","strategiewissen","lesetempo_kontrollfragen",
    "woerter_pro_minute","lesezeit_sekunden","hauptempfehlung",
    "zweitempfehlung","ich_weiss_es_nicht_anzahl",
    "wort_bild","wort_unterscheiden","wort_im_satz","lesetempo_einordnung",
    "lesetempo_unterbrochen","gesamtdauer_sekunden","durchlauf_unterbrochen","durchlauf_id"
  ]];

  runs.forEach(function (run) {
    const participant = participantMap.get(run.participantId);
    rows.push([
      run.participantId,
      run.participantNameSnapshot ?? participant?.name ?? "",
      run.classNameSnapshot ?? participant?.className ?? "",
      run.completedAt,
      run.setId,
      run.setVersion || "",
      run.rulesVersion || "",
      run.appVersion || "",
      run.scores && run.scores.reading_base != null ? run.scores.reading_base : "",
      run.scores && run.scores.word_sentence != null ? run.scores.word_sentence : "",
      run.scores && run.scores.text_basic != null ? run.scores.text_basic : "",
      run.scores && run.scores.text_deep != null ? run.scores.text_deep : "",
      run.scores && run.scores.word_analysis != null ? run.scores.word_analysis : "",
      run.scores && run.scores.strategy != null ? run.scores.strategy : "",
      run.scores && run.scores.fluency_check != null ? run.scores.fluency_check : "",
      run.fluency && run.fluency.wpm != null ? run.fluency.wpm : "",
      run.fluency && run.fluency.seconds ? Math.round(run.fluency.seconds * 10) / 10 : "",
      run.recommendation ? run.recommendation.primary : "",
      run.recommendation ? (run.recommendation.secondary || "") : "",
      Object.values(run.responses || {}).filter(function (value) { return value === "unknown"; }).length,
      run.readingBase?.word_recognition?.correct ?? "",
      run.readingBase?.orthographic_discrimination?.correct ?? "",
      run.readingBase?.word_in_sentence?.correct ?? "",
      run.fluency?.interpretation || "nicht_erhoben",
      run.fluency?.interrupted == null ? "" : run.fluency.interrupted ? "1" : "0",
      run.durationSeconds ?? "", run.interrupted == null ? "" : run.interrupted ? "1" : "0", run.id
    ]);
  });

  downloadCsv(
    "lesediagnostik5-ergebnisse-" + new Date().toISOString().slice(0, 10) + ".csv",
    rows
  );
}

function exportItemCsv() {
  if (!state.teacherUnlocked) return;
  const participants = loadParticipants();
  const participantMap = new Map(participants.map(function (item) {
    return [item.id, item];
  }));
  const runs = loadRuns();
  const rows = [[
    "teilnehmer_id","name_oder_kuerzel","klasse","zeitpunkt","parallelform",
    "aufgabensatz_version","auswertungsregeln_version","app_version",
    "item_id","antwort","kompetenz","auswertungsbereich","richtig","antwortreihenfolge","durchlauf_id"
  ]];

  runs.forEach(function (run) {
    const participant = participantMap.get(run.participantId);
    const items = Array.isArray(run.itemResults) ? run.itemResults : [];
    items.forEach(function (item) {
      rows.push([
        run.participantId,
        run.participantNameSnapshot ?? participant?.name ?? "",
        run.classNameSnapshot ?? participant?.className ?? "",
        run.completedAt,
        run.setId,
        run.setVersion || "",
        run.rulesVersion || "",
        run.appVersion || "",
        item.itemId,
        item.response,
        item.competency || "",
        item.scoreKey || "",
        item.correct === true ? "1" : item.correct === false ? "0" : "",
        (run.optionOrders?.[item.itemId] || []).join("|"), run.id
      ]);
    });
  });

  downloadCsv(
    "lesediagnostik5-itemdaten-" + new Date().toISOString().slice(0, 10) + ".csv",
    rows
  );
}

function escapeHtml(value) {
  return String(value == null ? "" : value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function escapeAttribute(value) {
  return escapeHtml(value);
}
// Data contracts: scored items and pilot rules must agree before the UI starts.
function validateProject(sets, rules) {
  const fail = message => { throw new Error("Ungültige Aufgabendaten: " + message); };
  if (!rules || !rules.scoreKeys || !rules.readingBaseComponents || !rules.recommendations ||
      !rules.fluency || !rules.fluency.checkInterpretation || !rules.strategyHint) fail("Regeln fehlen");
  const keys = Object.keys(INITIAL_SCORES);
  if (keys.length !== Object.keys(rules.scoreKeys).length) fail("Auswertungsbereiche");
  keys.forEach(key => { if (!Number.isInteger(rules.scoreKeys[key]?.max)) fail(key); });
  function condition(c) {
    if (!c || typeof c !== "object" || !Object.keys(c).length) fail("leere Bedingung");
    Object.entries(c).forEach(function ([key, value]) {
      if (key === "primary") { if (!rules.recommendations[value]) fail("Förderweg"); return; }
      if (key === "any") { if (!Array.isArray(value) || !value.length) fail("Alternativen"); value.forEach(condition); return; }
      if (!keys.includes(key) || !value || !Object.keys(value).length) fail("Bereich " + key);
      Object.entries(value).forEach(([op, n]) => { if (!["lt", "lte", "gt", "gte", "eq"].includes(op) || !Number.isFinite(n)) fail("Vergleich"); });
    });
  }
  [rules.primaryLogic, rules.secondaryLogic].forEach(list => {
    if (!Array.isArray(list)) fail("Empfehlungsregeln");
    list.forEach(rule => { condition(rule.when); if (!rules.recommendations[rule.recommend]) fail("Empfehlung"); });
  });
  condition(rules.strategyHint.when);
  const ids = new Set();
  sets.forEach(function (set) {
    if (set.schemaVersion !== 2 || !set.setId || !set.version || !Array.isArray(set.sections)) fail("Set");
    const sums = Object.assign({}, INITIAL_SCORES);
    const base = {};
    let timed = 0;
    function check(item, reserve) {
      if (!item.id || ids.has(item.id)) fail("Item-ID"); ids.add(item.id);
      if (!["choice", "visual_choice", "self_report", "timed_reading"].includes(item.type) || !item.prompt) fail(item.id);
      if (item.type === "timed_reading") {
        if (!item.text || item.wordCount !== item.text.trim().split(/\s+/u).length) fail("Wortzahl");
        if (!reserve) timed += 1;
        return;
      }
      if (!Array.isArray(item.options) || item.options.length < 2 || new Set(item.options.map(o => o.id)).size !== item.options.length) fail("Optionen");
      item.options.forEach(o => {
        if (!o.id) fail("Antwort-ID");
        if (item.type === "visual_choice" ? !/^[a-z]+$/.test(o.asset || "") : typeof o.text !== "string") fail("Antwortinhalt");
      });
      if (item.type === "self_report") { if (item.scoreKey || item.correctOption) fail("Selbsteinschätzung"); return; }
      if (!keys.includes(item.scoreKey) || !item.options.some(o => o.id === item.correctOption)) fail("Lösung oder Score");
      if (!reserve) {
        sums[item.scoreKey] += 1;
        if (item.scoreKey === "reading_base") base[item.competency] = (base[item.competency] || 0) + 1;
      }
    }
    flattenSet(set).forEach(i => check(i, false));
    (set.reserveItems || []).forEach(i => check(i, true));
    keys.forEach(key => { if (sums[key] !== rules.scoreKeys[key].max) fail("Maximalwert " + key); });
    Object.entries(rules.readingBaseComponents).forEach(([key, rule]) => { if (base[key] !== rule.max) fail("Lesebasis " + key); });
    if (timed !== 1) fail("Lesetext");
  });
  // Exhaustive coverage of the three domains driving the primary recommendation.
  for (let a = 0; a <= rules.scoreKeys.reading_base.max; a += 1)
    for (let b = 0; b <= rules.scoreKeys.word_sentence.max; b += 1)
      for (let c = 0; c <= rules.scoreKeys.text_basic.max; c += 1) {
        const scores = Object.assign({}, INITIAL_SCORES, { reading_base: a, word_sentence: b, text_basic: c });
        if (rules.primaryLogic.filter(r => matchesCondition(r.when, scores)).length !== 1) fail("Empfehlung nicht eindeutig");
      }
}

function assetUrl(asset) { return "./assets/lesebilder/" + asset + ".png?v=0.4"; }

async function preloadAssets(sets) {
  const names = new Set();
  sets.forEach(set => flattenSet(set).concat(set.reserveItems || []).forEach(i => (i.options || []).forEach(o => { if (o.asset) names.add(o.asset); })));
  await Promise.all(Array.from(names).map(asset => new Promise(function (resolve, reject) {
    const image = new Image();
    image.onload = function () { image.naturalWidth > 0 ? resolve() : reject(new Error("Bild leer")); };
    image.onerror = function () { reject(new Error("Bild fehlt: " + asset)); };
    image.src = assetUrl(asset);
  })));
}

document.addEventListener("visibilitychange", function () {
  if (document.hidden) {
    state.teacherUnlocked = false;
    if (state.stage === "task") state.interrupted = true;
    if (state.fluency.startedAt != null) state.fluency.interrupted = true;
    if (state.stage === "intro" && state.rules) renderIntro();
  }
});
window.addEventListener("beforeunload", function (event) {
  if (state.stage === "task" || state.stage === "example" || state.pendingRun) {
    event.preventDefault(); event.returnValue = "";
  }
});
