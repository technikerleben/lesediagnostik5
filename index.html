<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Digitaler Förderwegweiser für das Lesen in Jahrgang 5">
  <meta name="color-scheme" content="light">
  <title>Lese-Navigator Jahrgang 5</title>
  <style>
:root {
  --blue: #245688;
  --mint: #48DCCB;
  --orange: #F0A66F;
  --text: #1f2933;
  --muted: #66727f;
  --line: #d9e0e5;
  --panel: #f6f8f9;
  --white: #ffffff;
  --focus: #111827;
}

* {
  box-sizing: border-box;
}

html {
  background: var(--white);
}

body {
  margin: 0;
  color: var(--text);
  background: var(--white);
  font-family: "Glacial Indifference", "Aptos", "Segoe UI", Arial, sans-serif;
  font-size: 18px;
  line-height: 1.5;
}

button,
input,
select {
  font: inherit;
}

button {
  cursor: pointer;
}

.page-shell {
  width: min(100%, 980px);
  margin: 0 auto;
  padding: 28px 18px 60px;
}

.navigator {
  display: grid;
  gap: 24px;
}

.brandline {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}

.brandline h1,
.task-card h2,
.result-card h2 {
  margin: 0;
  font-family: "Gagalin", "Aptos Display", "Segoe UI", Arial, sans-serif;
  letter-spacing: 0.01em;
}

.brandline h1 {
  font-size: clamp(1.8rem, 4vw, 2.7rem);
}

.brandline p {
  margin: 4px 0 0;
  color: var(--muted);
}

.path-row {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
}

.path-card {
  display: grid;
  place-items: center;
  gap: 8px;
  min-height: 140px;
  padding: 16px 10px;
  border: 2px solid currentColor;
  border-radius: 18px;
  background: var(--white);
  text-align: center;
  font-weight: 700;
}

.path-card svg,
.path-symbol svg {
  width: 54px;
  height: 54px;
}

.wave { --path-accent: var(--blue); }
.compass { --path-accent: var(--mint); }
.magnifier { --path-accent: var(--orange); }

.path-card.wave,
.path-card.compass,
.path-card.magnifier,
.result-main.wave,
.result-main.compass,
.result-main.magnifier,
.result-secondary.wave,
.result-secondary.compass,
.result-secondary.magnifier {
  color: var(--text);
  border-color: var(--path-accent);
}

.path-card.wave svg,
.path-card.compass svg,
.path-card.magnifier svg,
.result-main.wave svg,
.result-main.compass svg,
.result-main.magnifier svg,
.result-secondary.wave svg,
.result-secondary.compass svg,
.result-secondary.magnifier svg {
  color: var(--path-accent);
}

.intro-card,
.task-card,
.result-card,
.passage-card {
  border: 1px solid var(--line);
  border-radius: 20px;
  background: var(--white);
}

.intro-card,
.task-card,
.result-card {
  padding: clamp(20px, 4vw, 36px);
}

.intro-card p {
  max-width: 700px;
}

.note {
  color: var(--muted);
  font-size: 0.94rem;
}

.primary-button,
.secondary-button,
.option-button,
.unknown-button {
  min-height: 52px;
  border-radius: 14px;
  padding: 12px 16px;
  border: 2px solid transparent;
}

.primary-button {
  background: var(--blue);
  color: white;
  font-weight: 800;
  padding-inline: 24px;
}

.secondary-button {
  background: var(--white);
  color: var(--text);
  border-color: var(--line);
  font-weight: 700;
}

.primary-button:hover,
.primary-button:focus-visible {
  filter: brightness(0.95);
}

button:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 3px;
}

.progress-wrap {
  display: grid;
  gap: 8px;
}

.progress-head {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  color: var(--muted);
  font-size: 0.92rem;
}

.progress-track {
  height: 10px;
  width: 100%;
  border-radius: 999px;
  background: #e8edf0;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  border-radius: inherit;
  background: var(--blue);
  transition: width 180ms ease;
}

.task-card {
  display: grid;
  gap: 20px;
}

.task-card h2 {
  font-size: clamp(1.35rem, 3vw, 1.8rem);
}

.prompt {
  margin: 0;
  font-size: clamp(1.16rem, 2.8vw, 1.42rem);
  font-weight: 700;
}

.options {
  display: grid;
  gap: 12px;
}

.option-button,
.unknown-button {
  width: 100%;
  text-align: left;
  background: var(--white);
  border-color: var(--line);
  color: var(--text);
}

.option-button:hover,
.option-button:focus-visible {
  border-color: var(--blue);
  background: #f7fafc;
}

.unknown-button {
  margin-top: 4px;
  color: var(--muted);
  border-style: dashed;
}

.visual-options {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}

.visual-options .option-button {
  min-height: 112px;
  display: grid;
  place-items: center;
  text-align: center;
  font-size: 2.2rem;
}

.passage-card {
  padding: 20px;
  background: var(--panel);
  white-space: pre-line;
}

.passage-card p {
  margin: 0;
  line-height: 1.72;
}

.timed-reading {
  display: grid;
  gap: 18px;
}

.timed-text {
  padding: 20px;
  border-radius: 16px;
  background: var(--panel);
  line-height: 1.8;
  font-size: 1.08rem;
}

.result-card {
  display: grid;
  gap: 22px;
}

.result-main,
.result-secondary {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 18px;
  align-items: center;
  padding: 18px;
  border: 2px solid currentColor;
  border-radius: 18px;
}

.result-main h3,
.result-secondary h3 {
  margin: 0 0 4px;
  font-size: 1.45rem;
}

.result-main p,
.result-secondary p {
  margin: 0;
  color: var(--text);
}

.path-symbol {
  display: grid;
  place-items: center;
}

.strategy-hint {
  padding: 14px 16px;
  border-left: 5px solid var(--mint);
  background: #f3fcfa;
  border-radius: 10px;
}

.result-actions {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}

.dev-note {
  margin-top: 4px;
  font-size: 0.86rem;
  color: var(--muted);
}

@media (max-width: 640px) {
  body {
    font-size: 17px;
  }

  .page-shell {
    padding: 18px 12px 44px;
  }

  .path-row {
    grid-template-columns: 1fr;
  }

  .path-card {
    min-height: 96px;
    grid-template-columns: auto 1fr;
    justify-items: start;
    text-align: left;
  }

  .visual-options {
    grid-template-columns: 1fr;
  }

  .visual-options .option-button {
    min-height: 78px;
  }

  .result-main,
  .result-secondary {
    grid-template-columns: 1fr;
  }
}

@media (prefers-reduced-motion: reduce) {
  .progress-fill {
    transition: none;
  }
}


.participant-box {
  margin: 22px 0;
  padding: 18px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--panel);
}

.participant-box h3 {
  margin: 0 0 6px;
  font-size: 1.12rem;
}

.form-grid {
  display: grid;
  grid-template-columns: minmax(0, 2fr) minmax(0, 1fr);
  gap: 14px;
  margin-top: 14px;
}

.form-grid label {
  display: grid;
  gap: 6px;
  font-weight: 700;
}

.form-grid input {
  width: 100%;
  min-height: 50px;
  padding: 10px 12px;
  border: 2px solid var(--line);
  border-radius: 12px;
  background: var(--white);
  color: var(--text);
  font-size: 1rem;
}

.form-grid input:focus {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
  border-color: var(--blue);
}

.local-only-note,
.save-message {
  padding: 12px 14px;
  border-radius: 12px;
  background: #f3fcfa;
  border-left: 5px solid var(--mint);
  font-size: 0.92rem;
}

.error-message {
  padding: 12px 14px;
  border-radius: 12px;
  background: #fff7f4;
  border-left: 5px solid var(--orange);
  font-weight: 700;
}

.local-admin {
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--white);
}

.local-admin summary {
  padding: 16px 18px;
  cursor: pointer;
  font-weight: 800;
}

.local-admin-body {
  padding: 0 18px 18px;
}

.danger-button {
  min-height: 52px;
  border-radius: 14px;
  padding: 12px 16px;
  border: 2px solid #a33a2c;
  background: var(--white);
  color: #81291f;
  font-weight: 800;
}

button:disabled {
  cursor: not-allowed;
  opacity: 0.45;
}

@media (max-width: 640px) {
  .form-grid {
    grid-template-columns: 1fr;
  }
}


.pin-gate {
  display: grid;
  gap: 12px;
}

.pin-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 12px;
  align-items: end;
}

.pin-row label {
  display: grid;
  gap: 6px;
  font-weight: 700;
}

.pin-row input {
  min-height: 50px;
  padding: 10px 12px;
  border: 2px solid var(--line);
  border-radius: 12px;
  background: var(--white);
  color: var(--text);
  font-size: 1rem;
}

.pin-row input:focus {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
  border-color: var(--blue);
}

@media (max-width: 640px) {
  .pin-row {
    grid-template-columns: 1fr;
  }
}


.visual-options .option-button {
  min-height: 132px;
  display: grid;
  place-items: center;
  text-align: center;
  padding: 10px;
}

.visual-asset {
  width: 96px;
  height: 96px;
  object-fit: contain;
  display: block;
}

@media (max-width: 640px) {
  .visual-asset {
    width: 82px;
    height: 82px;
  }

<body>
  <main id="app" class="page-shell">
    <div class="navigator">
      <section class="intro-card">
        <h1>Lese-Navigator</h1>
        <p>Die App wird geladen …</p>
      </section>
    </div>
  </main>
  <noscript>Für den Lese-Navigator muss JavaScript im Browser aktiviert sein.</noscript>
  <script>
"use strict";

const APP_VERSION = "0.6";
const PREFIX = "lesediagnostik5:v1";
const PARTICIPANTS_KEY = PREFIX + ":participants";
const RUNS_KEY = PREFIX + ":runs";
const TEACHER_PIN_KEY = PREFIX + ":teacher-pin";

const INITIAL_SCORES = {
  reading_base: 0,
  word_sentence: 0,
  text_basic: 0,
  text_deep: 0,
  word_analysis: 0,
  strategy: 0,
  fluency_check: 0
};

const state = {
  sets: [],
  rules: null,
  design: null,
  stage: "intro",
  runSeed: null,
  activeSet: null,
  queue: [],
  index: 0,
  scores: { ...INITIAL_SCORES },
  responses: {},
  fluency: { startedAt: null, seconds: null, wpm: null },
  participantName: "",
  className: "",
  currentParticipant: null,
  resultData: null,
  teacherUnlocked: false,
  saveMessage: "",
  selectedOption: null,
  exampleSelected: false
};

const app = document.getElementById("app");
document.addEventListener("DOMContentLoaded", init);

async function init() {
  try {
    const values = await Promise.all([
      loadJson("./data/sets/eiche.json"),
      loadJson("./data/sets/ahorn.json"),
      loadJson("./data/sets/birke.json"),
      loadJson("./data/scoring/pilot-rules.json"),
      loadJson("./data/design.json")
    ]);
    state.sets = values.slice(0, 3);
    state.rules = values[3];
    state.design = values[4];
    applyDesignConfig();
    render();
  } catch (error) {
    console.error(error);
    app.innerHTML =
      '<div class="navigator"><section class="intro-card">' +
      '<h1>Lese-Navigator</h1>' +
      '<p class="error-message">Die Aufgabendaten konnten nicht geladen werden.</p>' +
      '<p class="note">Bitte die Seite neu laden. Wenn der Fehler bleibt, muss die Deployment-Struktur geprüft werden.</p>' +
      '</section></div>';
  }
}

async function loadJson(url) {
  const response = await fetch(url, { cache: "no-store" });
  if (!response.ok) throw new Error("Fehler beim Laden von " + url);
  return response.json();
}

function storageAvailable() {
  try {
    const key = PREFIX + ":probe";
    localStorage.setItem(key, "1");
    localStorage.removeItem(key);
    return true;
  } catch {
    return false;
  }
}

function safeParse(value, fallback) {
  try {
    return value ? JSON.parse(value) : fallback;
  } catch {
    return fallback;
  }
}

function loadParticipants() {
  if (!storageAvailable()) return [];
  const value = safeParse(localStorage.getItem(PARTICIPANTS_KEY), []);
  return Array.isArray(value) ? value : [];
}

function loadRuns() {
  if (!storageAvailable()) return [];
  const value = safeParse(localStorage.getItem(RUNS_KEY), []);
  return Array.isArray(value) ? value : [];
}

function makeId(prefix) {
  if (typeof crypto !== "undefined" && crypto.randomUUID) {
    return prefix + "-" + crypto.randomUUID();
  }
  return prefix + "-" + Date.now() + "-" + Math.random().toString(36).slice(2);
}

function upsertParticipant(name, className) {
  const cleanName = String(name || "").trim();
  const cleanClass = String(className || "").trim();
  if (!cleanName) throw new Error("Bitte einen Namen oder ein Kürzel eingeben.");

  const participants = loadParticipants();
  const existing = participants.find(function (item) {
    return item.name.toLocaleLowerCase("de-DE") === cleanName.toLocaleLowerCase("de-DE") &&
      item.className.toLocaleLowerCase("de-DE") === cleanClass.toLocaleLowerCase("de-DE");
  });
  if (existing) return existing;

  const participant = {
    id: makeId("p"),
    name: cleanName,
    className: cleanClass,
    createdAt: new Date().toISOString()
  };
  localStorage.setItem(PARTICIPANTS_KEY, JSON.stringify(participants.concat([participant])));
  return participant;
}

function saveDiagnosticRun(run) {
  const runs = loadRuns();
  const entry = Object.assign({}, run, {
    id: run.id || makeId("r"),
    completedAt: run.completedAt || new Date().toISOString(),
    schemaVersion: 1
  });
  localStorage.setItem(RUNS_KEY, JSON.stringify(runs.concat([entry])));
  return entry;
}

function deleteAllLocalData() {
  localStorage.removeItem(PARTICIPANTS_KEY);
  localStorage.removeItem(RUNS_KEY);
}

function bytesToBase64(bytes) {
  let binary = "";
  for (const byte of bytes) binary += String.fromCharCode(byte);
  return btoa(binary);
}

function base64ToBytes(value) {
  const binary = atob(value);
  return Uint8Array.from(binary, function (char) { return char.charCodeAt(0); });
}

async function derivePinHash(pin, salt) {
  const material = await crypto.subtle.importKey(
    "raw",
    new TextEncoder().encode(pin),
    "PBKDF2",
    false,
    ["deriveBits"]
  );
  const bits = await crypto.subtle.deriveBits(
    { name: "PBKDF2", salt: salt, iterations: 180000, hash: "SHA-256" },
    material,
    256
  );
  return new Uint8Array(bits);
}

function hasTeacherPin() {
  return storageAvailable() && Boolean(localStorage.getItem(TEACHER_PIN_KEY));
}

async function setTeacherPin(pin) {
  const clean = String(pin || "").trim();
  if (!/^\d{4,10}$/.test(clean)) {
    throw new Error("Die Lehrkraft-PIN muss aus 4 bis 10 Ziffern bestehen.");
  }
  if (typeof crypto === "undefined" || !crypto.subtle) {
    throw new Error("Dieser Browser unterstützt die lokale PIN-Sicherung nicht.");
  }
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const hash = await derivePinHash(clean, salt);
  localStorage.setItem(TEACHER_PIN_KEY, JSON.stringify({
    version: 1,
    salt: bytesToBase64(salt),
    hash: bytesToBase64(hash)
  }));
}

async function verifyTeacherPin(pin) {
  if (typeof crypto === "undefined" || !crypto.subtle) return false;
  const stored = safeParse(localStorage.getItem(TEACHER_PIN_KEY), null);
  if (!stored || !stored.salt || !stored.hash) return false;
  const salt = base64ToBytes(stored.salt);
  const expected = base64ToBytes(stored.hash);
  const actual = await derivePinHash(String(pin || "").trim(), salt);
  if (actual.length !== expected.length) return false;
  let difference = 0;
  for (let i = 0; i < actual.length; i += 1) difference |= actual[i] ^ expected[i];
  return difference === 0;
}

function flattenSet(set) {
  return set.sections.flatMap(function (section) {
    return section.items.map(function (item) {
      return Object.assign({}, item, {
        sectionId: section.id,
        sectionTitle: section.title,
        contextPassage: section.passage || null
      });
    });
  });
}

function hashText(text) {
  let hash = 2166136261;
  for (let i = 0; i < text.length; i += 1) {
    hash ^= text.charCodeAt(i);
    hash = Math.imul(hash, 16777619);
  }
  return hash >>> 0;
}

function orderedOptions(options, seed, itemId) {
  if (!seed) return options;
  return options.slice().map(function (option) {
    return { option: option, order: hashText(seed + ":" + itemId + ":" + option.id) };
  }).sort(function (a, b) {
    return a.order - b.order;
  }).map(function (entry) {
    return entry.option;
  });
}

function pickRunSeed() {
  if (typeof crypto !== "undefined" && crypto.getRandomValues) {
    const data = new Uint32Array(1);
    crypto.getRandomValues(data);
    return data[0] || 1;
  }
  return Date.now() % 2147483647;
}

function applyDesignConfig() {
  if (!state.design) return;

  const root = document.documentElement;
  const theme = state.design.theme || {};
  const paths = state.design.paths || {};

  if (theme.background) root.style.setProperty("--white", theme.background);
  if (theme.text) root.style.setProperty("--text", theme.text);
  if (theme.lightGray) root.style.setProperty("--panel", theme.lightGray);

  if (paths.wave && paths.wave.color) {
    root.style.setProperty("--blue", paths.wave.color);
  }
  if (paths.compass && paths.compass.color) {
    root.style.setProperty("--mint", paths.compass.color);
  }
  if (paths.magnifier && paths.magnifier.color) {
    root.style.setProperty("--orange", paths.magnifier.color);
  }

  if (theme.fontBody) {
    document.body.style.fontFamily =
      '"' + theme.fontBody + '", "Aptos", "Segoe UI", Arial, sans-serif';
  }
}

function compareValue(actual, rule) {
  if (actual == null || !rule || typeof rule !== "object") return false;
  if (rule.lt != null && !(actual < rule.lt)) return false;
  if (rule.lte != null && !(actual <= rule.lte)) return false;
  if (rule.gt != null && !(actual > rule.gt)) return false;
  if (rule.gte != null && !(actual >= rule.gte)) return false;
  if (rule.eq != null && !(actual === rule.eq)) return false;
  return true;
}

function matchesCondition(condition, scores, context) {
  if (!condition || typeof condition !== "object") return false;
  context = context || {};

  if (condition.primary != null && context.primary !== condition.primary) {
    return false;
  }

  if (Array.isArray(condition.any)) {
    const anyMatches = condition.any.some(function (part) {
      return matchesCondition(part, scores, context);
    });
    if (!anyMatches) return false;
  }

  return Object.keys(condition).every(function (key) {
    if (key === "any" || key === "primary") return true;
    return compareValue(scores[key], condition[key]);
  });
}

function firstMatchingRecommendation(rules, scores, context) {
  const match = (rules || []).find(function (entry) {
    return matchesCondition(entry.when, scores, context);
  });
  return match ? match.recommend : null;
}

function recommendationFrom(scores) {
  const primary = firstMatchingRecommendation(
    state.rules.primaryLogic,
    scores,
    {}
  ) || "magnifier";

  const secondary = firstMatchingRecommendation(
    state.rules.secondaryLogic,
    scores,
    { primary: primary }
  );

  const strategyHint = matchesCondition(
    state.rules.strategyHint && state.rules.strategyHint.when,
    scores,
    { primary: primary }
  );

  return {
    primary: primary,
    secondary: secondary,
    strategyHint: strategyHint
  };
}

function applyScore(scores, item, optionId) {
  if (!item || !item.scoreKey || !item.correctOption || optionId !== item.correctOption) return scores;
  const next = Object.assign({}, scores);
  next[item.scoreKey] = (next[item.scoreKey] || 0) + 1;
  return next;
}

function buildItemResults(queue, responses) {
  return queue.filter(function (item) {
    return Object.prototype.hasOwnProperty.call(responses, item.id);
  }).map(function (item) {
    const response = responses[item.id];
    return {
      itemId: item.id,
      response: response,
      competency: item.competency || "",
      scoreKey: item.scoreKey || "",
      correct: item.correctOption == null ? null : response !== "unknown" && response === item.correctOption
    };
  });
}

function pathIcon(type) {

}

async function handleTeacherPin() {
  const input = document.getElementById("teacher-pin");
  const errorBox = document.getElementById("pin-error");
  const pin = String(input ? input.value : "").replace(/\D/g, "").slice(0, 10);

  try {
    if (!hasTeacherPin()) {
      await setTeacherPin(pin);
      state.teacherUnlocked = true;
      renderIntro();
      return;
    }
    const valid = await verifyTeacherPin(pin);
    if (!valid) throw new Error("Die PIN ist nicht richtig.");
    state.teacherUnlocked = true;
    renderIntro();
  } catch (error) {
    if (errorBox) {
      errorBox.hidden = false;
      errorBox.textContent = error instanceof Error ? error.message : "Die PIN konnte nicht verarbeitet werden.";
    }
  }
}

function startRun() {
  state.participantName = document.getElementById("participant-name").value || "";
  state.className = document.getElementById("class-name").value || "";

  if (!storageAvailable()) {
    renderIntro("Der lokale Browserspeicher ist auf diesem Gerät nicht verfügbar.");
    return;
  }
  if (!hasTeacherPin()) {
    renderIntro("Vor dem ersten Durchlauf muss die Lehrkraft unten eine Geräte-PIN festlegen.");
    return;
  }

  try {
    state.currentParticipant = upsertParticipant(state.participantName, state.className);
  } catch (error) {
    renderIntro(error instanceof Error ? error.message : "Die lokalen Angaben konnten nicht gespeichert werden.");
    return;
  }

  state.runSeed = pickRunSeed();
  state.activeSet = state.sets[state.runSeed % state.sets.length];
  state.queue = flattenSet(state.activeSet);
  state.index = 0;
  state.scores = Object.assign({}, INITIAL_SCORES);
  state.responses = {};
  state.fluency = { startedAt: null, seconds: null, wpm: null };
  state.resultData = null;
  state.saveMessage = "";
  state.selectedOption = null;
  state.exampleSelected = false;
  state.stage = "example";
  render();
}

function renderTask() {
  const current = state.queue[state.index];
  if (!current) return;

  const progress = state.queue.length ? Math.round((state.index / state.queue.length) * 100) : 0;
  const isTimed = current.type === "timed_reading";
  const timedStarted = state.fluency.startedAt != null;
  const selected = state.selectedOption;
  let questionContent = "";

  if (isTimed) {
    if (timedStarted) {
      questionContent =
        '<section class="reading-panel">' +
          '<span class="screen-label task-label">Leseaufgabe</span>' +
          '<div class="timed-text">' + escapeHtml(current.text) + '</div>' +
          '<div class="action-row"><button id="finish-reading" class="primary-button" type="button">Fertig gelesen</button></div>' +
        '</section>';
    } else {
      questionContent =
        '<section class="reading-panel">' +
          '<span class="screen-label task-label">Leseaufgabe</span>' +
          '<h2>Lies einen kurzen Text.</h2>' +
          '<p class="prompt">Lies in deinem normalen Tempo.</p>' +
          '<div class="action-row"><button id="start-reading" class="primary-button" type="button">Text zeigen</button></div>' +
        '</section>';
    }
  } else {
    const options = orderedOptions(current.options || [], state.runSeed, current.id);
    const optionHtml = options.map(function (option, optionIndex) {
      let content = "";

      if (current.type === "visual_choice" && option.asset) {
        content =
          '<img class="visual-asset" src="./assets/lesebilder/' +
          escapeAttribute(option.asset) +
          '.png" alt="" loading="eager" decoding="async">';
      } else if (current.type === "visual_choice") {
        content = escapeHtml(option.symbol || "");
      } else {
        content = escapeHtml(option.text || "");
      }

      const isSelected = selected === option.id;
      const aria = current.type === "visual_choice"
        ? ' aria-label="Bildoption ' + (optionIndex + 1) + '"'
        : "";

      return '<button class="option-button' + (isSelected ? ' is-selected' : '') +
        '" type="button" data-option="' + escapeAttribute(option.id) + '"' + aria +
        ' aria-pressed="' + isSelected + '">' + content + '</button>';
    }).join("");

    questionContent =
      '<section class="question-panel">' +
        '<span class="screen-label task-label">Aufgabe</span>' +
        '<p class="prompt">' + escapeHtml(current.prompt) + '</p>' +
        '<div class="options ' + (current.type === "visual_choice" ? "visual-options" : "") + '">' +
          optionHtml +
        '</div>' +
        (current.type !== "self_report"
          ? '<button id="unknown-answer" class="unknown-button' + (selected === "unknown" ? ' is-selected' : '') +
            '" type="button" aria-pressed="' + (selected === "unknown") + '">Ich weiß es nicht.</button>'
          : '') +
        (selected
          ? '<div class="action-row"><button id="confirm-answer" class="primary-button" type="button">Weiter</button></div>'
          : '') +
      '</section>';
  }

  app.innerHTML =
    '<div class="navigator student-screen">' +
      '<div class="progress-wrap" aria-label="Fortschritt">' +
        '<div class="progress-track" aria-hidden="true"><div class="progress-fill" style="width:' +
          progress + '%"></div></div>' +
      '</div>' +
      '<div class="task-layout ' + (current.contextPassage ? "has-passage" : "single-task") + '">' +
        (current.contextPassage
          ? '<section class="passage-panel"><span class="screen-label text-label">Text</span><p>' +
            escapeHtml(current.contextPassage) + '</p></section>'
          : '') +
        questionContent +
      '</div>' +
    '</div>';

  document.querySelectorAll("[data-option]").forEach(function (button) {
    button.addEventListener("click", function () {
      answer(button.dataset.option);
    });
  });

  const unknown = document.getElementById("unknown-answer");
  if (unknown) unknown.addEventListener("click", answerUnknown);

  const confirm = document.getElementById("confirm-answer");
  if (confirm) confirm.addEventListener("click", confirmAnswer);

  const startReading = document.getElementById("start-reading");
  if (startReading) startReading.addEventListener("click", function () {
    state.fluency.startedAt = performance.now();
    renderTask();
  });

  const finishReading = document.getElementById("finish-reading");
  if (finishReading) finishReading.addEventListener("click", finishTimedReading);
}

function answer(optionId) {
  state.selectedOption = optionId;
  renderTask();
}

function answerUnknown() {
  state.selectedOption = "unknown";
  renderTask();
}

function confirmAnswer() {
  const current = state.queue[state.index];
  const optionId = state.selectedOption;
  if (!current || !optionId) return;

  const nextResponses = Object.assign({}, state.responses);
  nextResponses[current.id] = optionId;

  const nextScores = optionId === "unknown"
    ? state.scores
    : applyScore(state.scores, current, optionId);

  advance(nextScores, nextResponses);
}

function advance(nextScores, nextResponses) {
  state.scores = nextScores;
  state.responses = nextResponses;
  state.selectedOption = null;
  state.index += 1;
  if (state.index >= state.queue.length) {
    completeRun();
    return;
  }
  renderTask();
}

function finishTimedReading() {
  const current = state.queue[state.index];
  if (!current || state.fluency.startedAt == null) return;
  const seconds = Math.max(1, (performance.now() - state.fluency.startedAt) / 1000);
  state.fluency.seconds = seconds;
  state.fluency.wpm = Math.round((current.wordCount / seconds) * 60);
  state.selectedOption = null;
  state.index += 1;
  if (state.index >= state.queue.length) {
    completeRun();
    return;
  }
  renderTask();
}

function completeRun() {
  const recommendation = recommendationFrom(state.scores);
  const itemResults = buildItemResults(state.queue, state.responses);
  state.resultData = {
    scores: state.scores,
    responses: state.responses,
    recommendation: recommendation,
    itemResults: itemResults
  };

  try {
    saveDiagnosticRun({
      participantId: state.currentParticipant.id,
      participantNameSnapshot: state.currentParticipant.name,
      classNameSnapshot: state.currentParticipant.className,
      setId: state.activeSet.setId,
      setVersion: state.activeSet.version,
      rulesVersion: state.rules.version,
      appVersion: APP_VERSION,
      scores: state.scores,
      responses: state.responses,
      itemResults: itemResults,
      fluency: { seconds: state.fluency.seconds, wpm: state.fluency.wpm },
      recommendation: recommendation
    });
    state.saveMessage = "Ergebnis wurde nur auf diesem Gerät gespeichert.";
  } catch {
    state.saveMessage = "Das Ergebnis konnte nicht im lokalen Browserspeicher gespeichert werden.";
  }

  state.stage = "result";
  render();
}

function renderResult() {
  const recommendation = state.resultData
    ? state.resultData.recommendation
    : recommendationFrom(state.scores);
  const primary = state.rules.recommendations[recommendation.primary];
  const secondary = recommendation.secondary
    ? state.rules.recommendations[recommendation.secondary]
    : null;

  app.innerHTML =
    '<div class="navigator">' +
      '<header class="brandline"><div><h1>Dein Lese-Tipp</h1><p>Das passt gerade gut zu deinem Lernen.</p></div></header>' +
      '<section class="result-card">' +
        '<div class="result-main ' + pathClass(recommendation.primary) + '">' +
          '<div class="path-symbol">' + pathIcon(recommendation.primary) + '</div>' +
          '<div><h3>Starte mit ' + escapeHtml(primary.label) + '</h3><p>' +
            escapeHtml(primary.childText) + '</p></div>' +
        '</div>' +
        (secondary
          ? '<div class="result-secondary ' + pathClass(recommendation.secondary) + '">' +
              '<div class="path-symbol">' + pathIcon(recommendation.secondary) + '</div>' +
              '<div><h3>Auch passend: ' + escapeHtml(secondary.label) + '</h3><p>' +
                escapeHtml(secondary.childText) + '</p></div></div>'
          : '') +
        (recommendation.strategyHint
          ? '<p class="strategy-hint"><strong>Extra-Tipp:</strong> Nutze beim Üben eine Strategiekarte.</p>'
          : '') +
        '<p class="note">Der Lese-Navigator zeigt dir einen Startpunkt. Er ist kein Test mit Note.</p>' +
        (state.saveMessage ? '<p class="save-message">' + escapeHtml(state.saveMessage) + '</p>' : '') +
        '<div class="result-actions">' +
          '<button id="next-person" class="primary-button" type="button">Nächster Durchlauf</button>' +
          '<button id="same-person" class="secondary-button" type="button">Noch einmal für dieselbe Person</button>' +
        '</div>' +
      '</section>' +
    '</div>';

  document.getElementById("next-person").addEventListener("click", function () {
    resetToIntro(false);
  });
  document.getElementById("same-person").addEventListener("click", function () {
    resetToIntro(true);
  });
}

function resetToIntro(keepParticipant) {
  state.stage = "intro";
  state.runSeed = null;
  state.activeSet = null;
  state.queue = [];
  state.index = 0;
  state.scores = Object.assign({}, INITIAL_SCORES);
  state.responses = {};
  state.fluency = { startedAt: null, seconds: null, wpm: null };
  state.resultData = null;
  state.saveMessage = "";
  state.selectedOption = null;
  state.exampleSelected = false;
  if (!keepParticipant) {
    state.participantName = "";
    state.className = "";
    state.currentParticipant = null;
  }
  render();
}

function pathClass(id) {
  if (id === "wave") return "wave";
  if (id === "compass") return "compass";
  return "magnifier";
}

function handleDeleteAll() {
  if (!confirm("Alle lokal gespeicherten Namen/Kürzel und Diagnoseergebnisse auf diesem Browser wirklich löschen?")) {
    return;
  }
  deleteAllLocalData();
  state.participantName = "";
  state.className = "";
  state.currentParticipant = null;
  renderIntro();
}

function csvEscape(value) {
  const text = value == null ? "" : String(value);
  return /[;"\n\r]/.test(text) ? '"' + text.replaceAll('"', '""') + '"' : text;
}

function downloadCsv(filename, rows) {
  const body = rows.map(function (row) {
    return row.map(csvEscape).join(";");
  }).join("\r\n");
  const blob = new Blob(["\uFEFF", body], { type: "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const anchor = document.createElement("a");
  anchor.href = url;
  anchor.download = filename;
  document.body.appendChild(anchor);
  anchor.click();
  anchor.remove();
  setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
}

function exportSummaryCsv() {
  const participants = loadParticipants();
  const participantMap = new Map(participants.map(function (item) {
    return [item.id, item];
  }));
  const runs = loadRuns();
  const rows = [[
    "teilnehmer_id","name_oder_kuerzel","klasse","zeitpunkt","parallelform",
    "aufgabensatz_version","auswertungsregeln_version","app_version",
    "lesebasis","wort_satz","textverstaendnis","tiefes_textverstaendnis",
    "worterschliessung","strategiewissen","lesetempo_kontrollfragen",
    "woerter_pro_minute","lesezeit_sekunden","hauptempfehlung",
    "zweitempfehlung","ich_weiss_es_nicht_anzahl"
  ]];

  runs.forEach(function (run) {
    const participant = participantMap.get(run.participantId);
    rows.push([
      run.participantId,
      participant ? participant.name : (run.participantNameSnapshot || ""),
      participant ? participant.className : (run.classNameSnapshot || ""),
      run.completedAt,
      run.setId,
      run.setVersion || "",
      run.rulesVersion || "",
      run.appVersion || "",
      run.scores && run.scores.reading_base != null ? run.scores.reading_base : "",
      run.scores && run.scores.word_sentence != null ? run.scores.word_sentence : "",
      run.scores && run.scores.text_basic != null ? run.scores.text_basic : "",
      run.scores && run.scores.text_deep != null ? run.scores.text_deep : "",
      run.scores && run.scores.word_analysis != null ? run.scores.word_analysis : "",
      run.scores && run.scores.strategy != null ? run.scores.strategy : "",
      run.scores && run.scores.fluency_check != null ? run.scores.fluency_check : "",
      run.fluency && run.fluency.wpm != null ? run.fluency.wpm : "",
      run.fluency && run.fluency.seconds ? Math.round(run.fluency.seconds * 10) / 10 : "",
      run.recommendation ? run.recommendation.primary : "",
      run.recommendation ? (run.recommendation.secondary || "") : "",
      Object.values(run.responses || {}).filter(function (value) { return value === "unknown"; }).length
    ]);
  });

  downloadCsv(
    "lesediagnostik5-ergebnisse-" + new Date().toISOString().slice(0, 10) + ".csv",
    rows
  );
}

function exportItemCsv() {
  const participants = loadParticipants();
  const participantMap = new Map(participants.map(function (item) {
    return [item.id, item];
  }));
  const runs = loadRuns();
  const rows = [[
    "teilnehmer_id","name_oder_kuerzel","klasse","zeitpunkt","parallelform",
    "aufgabensatz_version","auswertungsregeln_version","app_version",
    "item_id","antwort","kompetenz","auswertungsbereich","richtig"
  ]];

  runs.forEach(function (run) {
    const participant = participantMap.get(run.participantId);
    const items = Array.isArray(run.itemResults) ? run.itemResults : [];
    items.forEach(function (item) {
      rows.push([
        run.participantId,
        participant ? participant.name : (run.participantNameSnapshot || ""),
        participant ? participant.className : (run.classNameSnapshot || ""),
        run.completedAt,
        run.setId,
        run.setVersion || "",
        run.rulesVersion || "",
        run.appVersion || "",
        item.itemId,
        item.response,
        item.competency || "",
        item.scoreKey || "",
        item.correct === true ? "1" : item.correct === false ? "0" : ""
      ]);
    });
  });

  downloadCsv(
    "lesediagnostik5-itemdaten-" + new Date().toISOString().slice(0, 10) + ".csv",
    rows
  );
}

function escapeHtml(value) {
  return String(value == null ? "" : value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function escapeAttribute(value) {
  return escapeHtml(value);
}
