<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A6 Strategiekarte – Vorlage</title>
<style>
@page { size: A6 portrait; margin: 9mm; }
:root {
  --ink:#18324A; --line:#C9D0D4; --accent:#6A737A;
  --heading-font:"Gagalin","Arial Black",Arial,sans-serif;
  --body-font:"Glacial Indifference",Arial,Helvetica,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:var(--body-font);font-size:14pt;line-height:1.35}
.card{min-height:calc(148mm - 18mm);display:flex;flex-direction:column;gap:4mm}
header{border-bottom:1.2pt solid var(--accent);padding-bottom:3mm}
h1{font-family:var(--heading-font);font-size:20pt;line-height:1.05;margin:0}
ol{padding-left:7mm;margin:1mm 0}
li{margin:3mm 0}
.tip{margin-top:auto;border-top:1pt solid var(--line);padding-top:3mm;font-size:11.5pt}
</style>
</head>
<body>
<main class="card">
  <header><h1>Schwieriges Wort?</h1></header>
  <ol>
    <li><strong>Lies den Satz noch einmal.</strong></li>
    <li>Schau auf die Wörter davor und danach.</li>
    <li>Zerlege das Wort.</li>
    <li>Prüfe: Was passt hier?</li>
  </ol>
  <footer class="tip"><strong>Merke:</strong> Der Satz kann dir helfen.</footer>
</main>
</body>
</html>
